name: Build for Linux ARM64

on:
  workflow_dispatch:

env:
  FRITZING_VERSION: 1.0.7
  QT_VERSION: 6.8.3

  QT_SOURCE_URL: https://download.qt.io/archive/qt/6.8/6.8.3/single/qt-everywhere-src-6.8.3.tar.xz

  CLIPPER_URL: https://sourceforge.net/projects/polyclipping/files/clipper_ver6.4.2.zip/download

  LIBGIT2_VERSION: 1.7.1
  LIBGIT2_BASEURL: https://github.com/libgit2/libgit2/archive/refs/tags

  QUAZIP_VERSION: 1.4
  QUAZIP_BASEURL: https://github.com/stachenov/quazip/archive/refs/tags

  SVGPP_VERSION: 1.3.1
  SVGPP_BASEURL: https://github.com/svgpp/svgpp/archive/refs/tags

  NGSPICE_VERSION: ngspice-42
  NGSPICE_URL: https://git.code.sf.net/p/ngspice/ngspice

  APT: sudo apt -y -qq -o=Dpkg::Use-Pty=0

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:

      # ------------------------------------------------------------
      # Environment
      # ------------------------------------------------------------

      - name: Setup env vars
        run: |
          ROOT_DIR="$GITHUB_WORKSPACE"

          FRITZING_RELEASE_DIR="$ROOT_DIR/Fritzing-$FRITZING_VERSION"
          FRITZING_RELEASE_FILE="$ROOT_DIR/Fritzing-$FRITZING_VERSION-linux-aarch64.tar.gz"

          QT_DIR="$ROOT_DIR/qt-$QT_VERSION"

          CLIPPER_DIR="$ROOT_DIR/Clipper1-6.4.2/"

          LIBGIT2_DIR="$ROOT_DIR/libgit2-$LIBGIT2_VERSION"
          LIBGIT2_URL="$LIBGIT2_BASEURL/v$LIBGIT2_VERSION.zip"

          QUAZIP_ZIP_DIR="${ROOT_DIR}/quazip-$QUAZIP_VERSION"
          QUAZIP_DIR="${ROOT_DIR}/quazip-$QT_VERSION-${QUAZIP_VERSION}intuisphere"
          QUAZIP_URL="$QUAZIP_BASEURL/v$QUAZIP_VERSION.zip"

          SVGPP_DIR="$ROOT_DIR/svgpp-$SVGPP_VERSION"
          SVGPP_URL="$SVGPP_BASEURL/v$SVGPP_VERSION.zip"

          NGSPICE_DIR="$ROOT_DIR/$NGSPICE_VERSION"
          NGSPICE_DIR_INSTALL="$ROOT_DIR/$NGSPICE_VERSION/install"

          echo "ROOT_DIR=$ROOT_DIR" >> "$GITHUB_ENV"
          echo "QT_DIR=$QT_DIR" >> "$GITHUB_ENV"

          echo "CLIPPER_DIR=$CLIPPER_DIR" >> "$GITHUB_ENV"

          echo "LIBGIT2_DIR=$LIBGIT2_DIR" >> "$GITHUB_ENV"
          echo "LIBGIT2_URL=$LIBGIT2_URL" >> "$GITHUB_ENV"

          echo "QUAZIP_ZIP_DIR=$QUAZIP_ZIP_DIR" >> "$GITHUB_ENV"
          echo "QUAZIP_DIR=$QUAZIP_DIR" >> "$GITHUB_ENV"
          echo "QUAZIP_URL=$QUAZIP_URL" >> "$GITHUB_ENV"

          echo "SVGPP_DIR=$SVGPP_DIR" >> "$GITHUB_ENV"
          echo "SVGPP_URL=$SVGPP_URL" >> "$GITHUB_ENV"

          echo "NGSPICE_DIR=$NGSPICE_DIR" >> "$GITHUB_ENV"
          echo "NGSPICE_DIR_INSTALL=$NGSPICE_DIR_INSTALL" >> "$GITHUB_ENV"

          echo "FRITZING_RELEASE_DIR=$FRITZING_RELEASE_DIR" >> "$GITHUB_ENV"
          echo "FRITZING_RELEASE_FILE=$FRITZING_RELEASE_FILE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Verify ARM64
      # ------------------------------------------------------------

      - name: Check architecture
        run: |
          echo "uname:"
          uname -a

          echo
          echo "Machine:"
          uname -m

          echo
          echo "Debian architecture:"
          dpkg --print-architecture

          echo
          echo "Compiler:"
          gcc -dumpmachine

      # ------------------------------------------------------------
      # Checkout Fritzing
      # ------------------------------------------------------------

      - name: Checkout Fritzing app
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-app
          ref: ${{ env.FRITZING_VERSION }}
          path: fritzing-app
          fetch-depth: 1

      - name: Checkout Fritzing parts
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-parts
          fetch-depth: 1

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------

      - name: Install system dependencies
        run: |
          $APT update

          $APT install \
            autoconf \
            automake \
            libtool \
            bison \
            fd-find \
            flex \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            python3-pip \
            libboost-all-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpulse-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xkb-dev \
            libxkbcommon-x11-0 \
            libssl-dev \
            libarchive-dev \
            libbz2-dev \
            zlib1g-dev

      # ------------------------------------------------------------
      # Build Qt 6.8.3 for ARM64
      # ------------------------------------------------------------

      - name: Build Qt
        run: |
          cd "$ROOT_DIR"

          wget -nv \
            "$QT_SOURCE_URL" \
            -O qt.tar.xz

          tar -xf qt.tar.xz

          cd "qt-everywhere-src-$QT_VERSION"

          ./configure \
            -prefix "$QT_DIR" \
            -release \
            -opensource \
            -confirm-license \
            -nomake examples \
            -nomake tests

          cmake --build . \
            --parallel "$(nproc)"

          cmake --install .

          echo "$QT_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Qt
        run: |
          qmake6 --version

          echo
          echo "Qt directory:"
          find "$QT_DIR" -maxdepth 2 -type f | head -50

      # ------------------------------------------------------------
      # Build ngspice
      # ------------------------------------------------------------

      - name: Build ngspice
        run: |
          cd "$ROOT_DIR"

          git clone \
            --depth 1 \
            --branch "$NGSPICE_VERSION" \
            --single-branch \
            "$NGSPICE_URL" \
            "$NGSPICE_DIR"

          cd "$NGSPICE_DIR"

          ./autogen.sh

          ./configure \
            --with-ngshared \
            --enable-xspice \
            --disable-debug \
            --prefix="$NGSPICE_DIR_INSTALL"

          make -j"$(nproc)"
          make install

          mkdir -p include/ngspice

          cp install/include/ngspice/*.h \
            include/ngspice/

          # Fritzing expects the library directly under ngspice-42/lib
          mkdir -p lib

          cp install/lib/libngspice.so* \
            lib/

          echo
          echo "ngspice libraries:"
          fdfind . "$NGSPICE_DIR_INSTALL/lib/" -a -x ls -ld

          echo
          echo "ngspice headers:"
          fdfind . "$NGSPICE_DIR_INSTALL/include/ngspice" -a -x ls -ld

      # ------------------------------------------------------------
      # Build Clipper
      # ------------------------------------------------------------

      - name: Build Clipper1 (polyclipping 6.4.2)
        run: |
          cd "$ROOT_DIR"

          mkdir -p \
            "$CLIPPER_DIR/include/polyclipping" \
            "$CLIPPER_DIR/lib"

          wget -nv \
            "$CLIPPER_URL" \
            -O clipper.zip

          unzip -q clipper.zip -d clipper-src

          cp \
            clipper-src/cpp/clipper.hpp \
            "$CLIPPER_DIR/include/polyclipping/"

          g++ \
            -std=c++17 \
            -O2 \
            -fPIC \
            -I"$CLIPPER_DIR/include/polyclipping/" \
            -c \
            "$ROOT_DIR/clipper-src/cpp/clipper.cpp" \
            -o \
            "$ROOT_DIR/clipper-src/cpp/clipper.o"

          ar rcs \
            "$CLIPPER_DIR/lib/libpolyclipping.a" \
            "$ROOT_DIR/clipper-src/cpp/clipper.o"

          echo
          echo "Clipper library:"
          fdfind . "$CLIPPER_DIR/lib/" -a -x ls -ld

          echo
          echo "Clipper headers:"
          fdfind . "$CLIPPER_DIR/include/polyclipping" -a -x ls -ld

      # ------------------------------------------------------------
      # Build libgit2
      # ------------------------------------------------------------

      - name: Build libgit2
        run: |
          cd "$ROOT_DIR"

          wget -nv \
            "$LIBGIT2_URL" \
            -O libgit2.zip

          unzip -q libgit2.zip

          cd "$LIBGIT2_DIR"

          cmake \
            -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LIBGIT2_DIR"

          cmake --build build \
            -j"$(nproc)" \
            --config Release

          cmake --install build

          echo
          echo "libgit2 library:"
          fdfind . "$LIBGIT2_DIR/lib/" -a -x ls -ld

          echo
          echo "libgit2 headers:"
          fdfind . "$LIBGIT2_DIR/include/" -a -x ls -ld

      # ------------------------------------------------------------
      # Build QuaZip
      # ------------------------------------------------------------

      - name: Build QuaZip
        run: |
          cd "$ROOT_DIR"

          wget -nv \
            "$QUAZIP_URL" \
            -O quazip.zip

          unzip -q quazip.zip

          mv \
            "$QUAZIP_ZIP_DIR" \
            "$QUAZIP_DIR"

          cd "$QUAZIP_DIR"

          cmake \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DCMAKE_PREFIX_PATH="$QT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$QUAZIP_DIR"

          cmake --build build \
            -j"$(nproc)"

          cmake --install build

          echo
          echo "QuaZip:"
          fdfind . \
            "$QUAZIP_DIR/include/QuaZip-Qt6-1.4/quazip" \
            -a -x ls -ld

      # ------------------------------------------------------------
      # Fetch svgpp
      # ------------------------------------------------------------

      - name: Fetch svgpp
        run: |
          cd "$ROOT_DIR"

          wget -nv \
            "$SVGPP_URL" \
            -O svgpp.zip

          unzip -q svgpp.zip

          fdfind . \
            "$SVGPP_DIR/include/svgpp" \
            -a -x ls -ld

      # ------------------------------------------------------------
      # Configure Fritzing
      # ------------------------------------------------------------

      - name: Configure Fritzing
        working-directory: fritzing-app
        run: |
          mkdir -p "$FRITZING_RELEASE_DIR"

          qmake6 \
            phoenix.pro \
            CONFIG+=release \
            QT+=core5compat \
            DEFINES+=QT_NO_DEBUG \
            PREFIX="$FRITZING_RELEASE_DIR"

      # ------------------------------------------------------------
      # Build Fritzing
      # ------------------------------------------------------------

      - name: Build Fritzing
        working-directory: fritzing-app
        run: |
          make -j"$(nproc)"
          make install

      # ------------------------------------------------------------
      # Verify Fritzing is ARM64
      # ------------------------------------------------------------

      - name: Check Fritzing architecture
        run: |
          file "$FRITZING_RELEASE_DIR/Fritzing"

          echo
          echo "Release directory:"
          find "$FRITZING_RELEASE_DIR" -maxdepth 2 -type f

      # ------------------------------------------------------------
      # Prepare artifact
      # ------------------------------------------------------------

      - name: Prepare artifact
        run: |
          cd "$GITHUB_WORKSPACE/fritzing-parts"

          rm -rf ".git"

          cd "$FRITZING_RELEASE_DIR"

          mv \
            "$GITHUB_WORKSPACE/fritzing-parts" \
            .

          cd "$ROOT_DIR"

          tar -czf "$FRITZING_RELEASE_FILE" \
            --exclude='.git' \
            -C "$(dirname "$FRITZING_RELEASE_DIR")" \
            "$(basename "$FRITZING_RELEASE_DIR")"

          echo
          echo "Release:"
          ls -lh "$FRITZING_RELEASE_FILE"

      # ------------------------------------------------------------
      # GitHub release
      # ------------------------------------------------------------

      - name: Create a new Github release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          make_latest: true
          tag_name: v${{ env.FRITZING_VERSION }}
          files: |
            ${{ env.FRITZING_RELEASE_FILE }}
