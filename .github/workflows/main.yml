name: Build

on:
  workflow_dispatch

env:
  APT: sudo apt -y -qq -o=Dpkg::Use-Pty=0
  QT_VERSION: 6.8.3

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fritzing app
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-app
          ref: 1.0.7
          path: fritzing-app
          fetch-depth: 1

      - name: Checkout Fritzing parts
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-parts
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          $APT update

          $APT install \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            python3-pip \
            libboost-all-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpulse-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xkb-dev \
            libxkbcommon-x11-0 \
            libssl-dev \
            libarchive-dev \
            libbz2-dev \
            zlib1g-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: >
            qtcharts
            qtserialport
            qt5compat

      - name: Prepare dependencies
        run: |
          mkdir -p deps

          cd deps

          # libgit2
          git clone --depth=1 https://github.com/libgit2/libgit2.git

          cd libgit2
          cmake \
            -B build \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_SSH=OFF

          cmake --build build -j$(nproc)
          sudo cmake --install build


      - name: Build ngspice
        run: |
          cd "$GITHUB_WORKSPACE"
      
          git clone --depth=1 \
            https://git.code.sf.net/p/ngspice/ngspice \
            ngspice-42
      
          cd ngspice-42
      
          ./autogen.sh
      
          mkdir release
          cd release
      
          ../configure \
            --with-ngshared \
            --enable-xspice \
            --disable-debug \
            --prefix="$GITHUB_WORKSPACE/ngspice-42/install"
      
          make -j$(nproc)
          make install
      
      - name: Build QuaZip
        run: |
          cd "$GITHUB_WORKSPACE"
      
          git clone https://github.com/stachenov/quazip.git \
            quazip-6.8.3-1.4intuisphere
      
          cd quazip-6.8.3-1.4intuisphere
      
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/quazip-6.8.3-1.4intuisphere"
      
          cmake --build build -j$(nproc)
          cmake --install build

      - name: Fix QuaZip include layout
        shell: bash
        run: |
          set -euxo pipefail
      
          QUAZIP_DIR="$GITHUB_WORKSPACE/quazip-6.8.3-1.4intuisphere"
          QUAZIP_INC="$QUAZIP_DIR/include/QuaZip-Qt6-1.4/quazip"
      
          mkdir -p "$QUAZIP_INC"
      
          # Public headers
          cp "$QUAZIP_DIR"/quazip/*.h "$QUAZIP_INC/"
      
          # Generated configuration header
          cp "$(find "$QUAZIP_DIR/build" -name quazip_config.h -type f | head -1)" \
             "$QUAZIP_INC/"
      
          echo "QuaZip headers:"
          find "$QUAZIP_INC" -type f | sort

      - name: Configure Fritzing
        working-directory: fritzing-app
        run: |
          qmake6 phoenix.pro \
            CONFIG+=release \
            QT+=core5compat \
            DEFINES+=QT_NO_DEBUG

      - name: Build Fritzing
        working-directory: fritzing-app
        run: |
          make -j$(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp fritzing-app/Fritzing artifact/

          cp -r fritzing-parts artifact/parts

          tar czf \
            fritzing-1.0.7-linux-x86_64.tar.gz \
            -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fritzing-1.0.7-linux-x86_64
          path: fritzing-1.0.7-linux-x86_64.tar.gz
