name: Build

on:
  workflow_dispatch

env:
  APT: sudo apt -y -qq -o=Dpkg::Use-Pty=0
  QT_VERSION: 6.8.3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fritzing app
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-app
          ref: 1.0.7
          path: fritzing-app
          fetch-depth: 1

      - name: Checkout Fritzing parts
        uses: actions/checkout@v7
        with:
          repository: fritzing/fritzing-parts
          path: fritzing-parts
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          $APT update

          $APT install \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            python3 \
            python3-pip \
            libboost-all-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpulse-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xkb-dev \
            libxkbcommon-x11-0 \
            libssl-dev \
            libarchive-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: gcc_64
          modules: >
            qtcharts
            qtserialport
            qtsvg
            qt5compat
            qttools

      - name: Prepare dependencies
        run: |
          mkdir -p deps

          cd deps

          # libgit2
          git clone --depth=1 https://github.com/libgit2/libgit2.git

          cd libgit2
          cmake \
            -B build \
            -DBUILD_SHARED_LIBS=ON \
            -DUSE_SSH=OFF

          cmake --build build -j$(nproc)
          sudo cmake --install build

      - name: Configure Fritzing
        working-directory: fritzing-app
        run: |
          qmake6 phoenix.pro \
            CONFIG+=release \
            DEFINES+=QT_NO_DEBUG

      - name: Build Fritzing
        working-directory: fritzing-app
        run: |
          make -j$(nproc)

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          cp fritzing-app/Fritzing artifact/

          cp -r fritzing-parts artifact/parts

          tar czf \
            fritzing-1.0.7-linux-x86_64.tar.gz \
            -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fritzing-1.0.7-linux-x86_64
          path: fritzing-1.0.7-linux-x86_64.tar.gz
